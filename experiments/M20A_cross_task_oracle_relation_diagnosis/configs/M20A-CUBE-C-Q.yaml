study_id: M20A
config_id: M20A-CUBE-C-Q
slug: cube_c_q_phase2
algorithm: gciql
environment: cube-triple-play-v0
protocol_stage: phase2_formal
executable: true
training_seed: 0
condition_id: C-Q
semantic_condition: CUBE_CORRECT_HYBRID_CONTEXT_QUERY
description: >-
  Formal M20A Phase-2 screening configuration. Cube thresholds were frozen
  by the user from source-grounded geometry, not downstream RL performance.
factors:
  task_family: cube
  environment: cube-triple-play-v0
  relation_mode: correct
  readout: hybrid_context_query
  alpha: 1.0
  training_seed: 0
  token_dim: 128
  topology: feedforward
  credit: direct
  mixer: {num_blocks: 2, token_hidden_dim: 64, channel_hidden_dim: 256, tm_mode: none}
  relation_augmenter: {relation_hidden_dim: 256, activation: gelu, first_use_bias: false, second_use_bias: false, normalization: none, dropout: none, output_dim: 128}
  hybrid_query_dim: 128
  shuffle_design_seed: 20020
  num_entities: 3
  num_relation_types: 3
  entity_family: cube_triple
frozen_protocol:
  train_steps: 1000000
  batch_size: 1024
  log_interval: 5000
  eval_interval: 100000
  eval_tasks: all
  eval_episodes: 50
  eval_temperature: 0.0
  video_episodes: 0
  save_interval: 100000
  save_best_checkpoint: true
  save_last_checkpoint: true
  primary_endpoint: final@1M
  secondary_endpoints: [best_success, best_step, last3_mean, normalized_eval_auc]
  auc: {checkpoints: [100000, 200000, 300000, 400000, 500000, 600000, 700000, 800000, 900000, 1000000], interval: [100000, 1000000], rule: trapezoidal_area_divided_by_900000}
  cube_threshold_status: FROZEN_USER_PHASE2
  cube_relation_thresholds: {current_support_epsilon_xy: 0.02, current_support_epsilon_z: 0.01, goal_support_epsilon_xy: 0.02, goal_support_epsilon_z: 0.01, goal_conflict_radius: 0.04}
  cube_identity_mechanism: no_slot_embedding_source_audited_role_permutation
agent_overrides:
  actor_loss: ddpgbc
  alpha: 1.0
  actor_hidden_dims: [512, 512, 512]
  value_hidden_dims: [512, 512, 512]
  layer_norm: true
  lr: 0.0003
  batch_size: 1024
  discount: 0.99
  expectile: 0.9
  tau: 0.005
  const_std: true
  discrete: false
  compute:
    actor:
      enabled: true
      primitive: mlp
      structure: cube_tokens
      structure_kwargs: {num_cubes: 3, robot_dim: 19, cube_feature_dim: 9, token_dim: 128, robot_hidden_dim: 128, slot_identity_embedding: false}
      block: mlp_mixer
      block_kwargs: {num_blocks: 2, token_hidden_dim: 64, channel_hidden_dim: 256, tm_mode: none}
      topology: feedforward
      credit: direct
      relation_mode: correct
      relation_kwargs: {num_relation_types: 3, shuffle_derangement: [1, 2, 0], current_support_epsilon_xy: 0.02, current_support_epsilon_z: 0.01, goal_support_epsilon_xy: 0.02, goal_support_epsilon_z: 0.01, goal_conflict_radius: 0.04, threshold_status: FROZEN_USER_PHASE2, cube_height: 0.04, xyz_scaler: 10.0}
      relation_augmenter: relation_mlp
      relation_augmenter_kwargs: {relation_hidden_dim: 256, activation: gelu, first_use_bias: false, second_use_bias: false, normalization: none, dropout: none, output_dim: 128}
      readout: hybrid_context_query
      readout_kwargs: {output_dim: 512, query_dim: 128}
    value:
      enabled: true
      primitive: mlp
      structure: cube_tokens
      structure_kwargs: {num_cubes: 3, robot_dim: 19, cube_feature_dim: 9, token_dim: 128, robot_hidden_dim: 128, slot_identity_embedding: false}
      block: mlp_mixer
      block_kwargs: {num_blocks: 2, token_hidden_dim: 64, channel_hidden_dim: 256, tm_mode: none}
      topology: feedforward
      credit: direct
      relation_mode: correct
      relation_kwargs: {num_relation_types: 3, shuffle_derangement: [1, 2, 0], current_support_epsilon_xy: 0.02, current_support_epsilon_z: 0.01, goal_support_epsilon_xy: 0.02, goal_support_epsilon_z: 0.01, goal_conflict_radius: 0.04, threshold_status: FROZEN_USER_PHASE2, cube_height: 0.04, xyz_scaler: 10.0}
      relation_augmenter: relation_mlp
      relation_augmenter_kwargs: {relation_hidden_dim: 256, activation: gelu, first_use_bias: false, second_use_bias: false, normalization: none, dropout: none, output_dim: 128}
      readout: hybrid_context_query
      readout_kwargs: {output_dim: 512, query_dim: 128}
    critic:
      enabled: true
      primitive: mlp
      structure: cube_tokens
      structure_kwargs: {num_cubes: 3, robot_dim: 19, cube_feature_dim: 9, token_dim: 128, robot_hidden_dim: 128, slot_identity_embedding: false}
      block: mlp_mixer
      block_kwargs: {num_blocks: 2, token_hidden_dim: 64, channel_hidden_dim: 256, tm_mode: none}
      topology: feedforward
      credit: direct
      relation_mode: correct
      relation_kwargs: {num_relation_types: 3, shuffle_derangement: [1, 2, 0], current_support_epsilon_xy: 0.02, current_support_epsilon_z: 0.01, goal_support_epsilon_xy: 0.02, goal_support_epsilon_z: 0.01, goal_conflict_radius: 0.04, threshold_status: FROZEN_USER_PHASE2, cube_height: 0.04, xyz_scaler: 10.0}
      relation_augmenter: relation_mlp
      relation_augmenter_kwargs: {relation_hidden_dim: 256, activation: gelu, first_use_bias: false, second_use_bias: false, normalization: none, dropout: none, output_dim: 128}
      readout: hybrid_context_query
      readout_kwargs: {output_dim: 512, query_dim: 128}
