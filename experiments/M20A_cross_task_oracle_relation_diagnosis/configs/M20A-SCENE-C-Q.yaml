study_id: M20A
config_id: M20A-SCENE-C-Q
slug: scene_c_q_phase2
algorithm: gciql
environment: scene-play-v0
protocol_stage: phase2_formal
executable: true
training_seed: 0
condition_id: C-Q
semantic_condition: SCENE_CORRECT_HYBRID_CONTEXT_QUERY
description: >-
  Formal M20A Phase-2 screening configuration under the frozen relation,
  GCIQL, alpha=1.0, evaluation, architecture, and seed protocol.
factors:
  task_family: scene
  environment: scene-play-v0
  relation_mode: correct
  readout: hybrid_context_query
  alpha: 1.0
  training_seed: 0
  token_dim: 128
  topology: feedforward
  credit: direct
  mixer: {num_blocks: 2, token_hidden_dim: 64, channel_hidden_dim: 256, tm_mode: none}
  relation_augmenter: {relation_hidden_dim: 256, activation: gelu, first_use_bias: false, second_use_bias: false, normalization: none, dropout: none, output_dim: 128}
  hybrid_query_dim: 128
  shuffle_design_seed: 20020
  num_entities: 5
  num_relation_types: 1
  entity_family: scene_control_entities
frozen_protocol:
  train_steps: 1000000
  batch_size: 1024
  log_interval: 5000
  eval_interval: 100000
  eval_tasks: all
  eval_episodes: 50
  eval_temperature: 0.0
  video_episodes: 0
  save_interval: 100000
  save_best_checkpoint: true
  save_last_checkpoint: true
  primary_endpoint: final@1M
  secondary_endpoints: [best_success, best_step, last3_mean, normalized_eval_auc]
  auc: {checkpoints: [100000, 200000, 300000, 400000, 500000, 600000, 700000, 800000, 900000, 1000000], interval: [100000, 1000000], rule: trapezoidal_area_divided_by_900000}
  scene_control_mapping: button_0_to_drawer__button_1_to_window
agent_overrides:
  actor_loss: ddpgbc
  alpha: 1.0
  actor_hidden_dims: [512, 512, 512]
  value_hidden_dims: [512, 512, 512]
  layer_norm: true
  lr: 0.0003
  batch_size: 1024
  discount: 0.99
  expectile: 0.9
  tau: 0.005
  const_std: true
  discrete: false
  compute:
    actor:
      enabled: true
      primitive: mlp
      structure: scene_tokens
      structure_kwargs: {robot_dim: 19, cube_feature_dim: 9, button_feature_dim: 4, drawer_feature_dim: 2, window_feature_dim: 2, token_dim: 128, robot_hidden_dim: 128, button_role_embedding: true}
      block: mlp_mixer
      block_kwargs: {num_blocks: 2, token_hidden_dim: 64, channel_hidden_dim: 256, tm_mode: none}
      topology: feedforward
      credit: direct
      relation_mode: correct
      relation_kwargs: {num_relation_types: 1, entity_order: [cube, button_0, button_1, drawer, window], correct_edges: [[button_0, drawer], [button_1, window]], shuffled_edges: [[button_0, window], [button_1, drawer]]}
      relation_augmenter: relation_mlp
      relation_augmenter_kwargs: {relation_hidden_dim: 256, activation: gelu, first_use_bias: false, second_use_bias: false, normalization: none, dropout: none, output_dim: 128}
      readout: hybrid_context_query
      readout_kwargs: {output_dim: 512, query_dim: 128}
    value:
      enabled: true
      primitive: mlp
      structure: scene_tokens
      structure_kwargs: {robot_dim: 19, cube_feature_dim: 9, button_feature_dim: 4, drawer_feature_dim: 2, window_feature_dim: 2, token_dim: 128, robot_hidden_dim: 128, button_role_embedding: true}
      block: mlp_mixer
      block_kwargs: {num_blocks: 2, token_hidden_dim: 64, channel_hidden_dim: 256, tm_mode: none}
      topology: feedforward
      credit: direct
      relation_mode: correct
      relation_kwargs: {num_relation_types: 1, entity_order: [cube, button_0, button_1, drawer, window], correct_edges: [[button_0, drawer], [button_1, window]], shuffled_edges: [[button_0, window], [button_1, drawer]]}
      relation_augmenter: relation_mlp
      relation_augmenter_kwargs: {relation_hidden_dim: 256, activation: gelu, first_use_bias: false, second_use_bias: false, normalization: none, dropout: none, output_dim: 128}
      readout: hybrid_context_query
      readout_kwargs: {output_dim: 512, query_dim: 128}
    critic:
      enabled: true
      primitive: mlp
      structure: scene_tokens
      structure_kwargs: {robot_dim: 19, cube_feature_dim: 9, button_feature_dim: 4, drawer_feature_dim: 2, window_feature_dim: 2, token_dim: 128, robot_hidden_dim: 128, button_role_embedding: true}
      block: mlp_mixer
      block_kwargs: {num_blocks: 2, token_hidden_dim: 64, channel_hidden_dim: 256, tm_mode: none}
      topology: feedforward
      credit: direct
      relation_mode: correct
      relation_kwargs: {num_relation_types: 1, entity_order: [cube, button_0, button_1, drawer, window], correct_edges: [[button_0, drawer], [button_1, window]], shuffled_edges: [[button_0, window], [button_1, drawer]]}
      relation_augmenter: relation_mlp
      relation_augmenter_kwargs: {relation_hidden_dim: 256, activation: gelu, first_use_bias: false, second_use_bias: false, normalization: none, dropout: none, output_dim: 128}
      readout: hybrid_context_query
      readout_kwargs: {output_dim: 512, query_dim: 128}
