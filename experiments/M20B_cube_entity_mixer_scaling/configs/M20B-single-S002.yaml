study_id: M20B
config_id: M20B-single-S002
slug: cube_single_entity_mixer_l2_s002_seed0
algorithm: gciql
environment: cube-single-play-v0
protocol_stage: formal
placement: actor+value+critic
executable: true
training_seed: 0
condition_id: S002
semantic_condition: CUBE_ENTITY_TOKENS_MIXER_L2_MEAN_CONTEXT
description: >-
  Cube Entity Tokens plus feed-forward MLP-Mixer L2 and MeanContextReadout
  on cube-single-play-v0. The structured package is relation-free.
factors:
  environment: cube-single-play-v0
  package_condition: S002
  structure: cube_tokens
  topology: feedforward
  block: mlp_mixer
  num_cubes: 1
  token_interaction: true
  cross_entity_interaction: false
  readout: mean_context
  relation_mode: legacy_none
  relation_study: false
  alpha: 1.0
frozen_protocol:
  train_steps: 1000000
  batch_size: 1024
  log_interval: 5000
  eval_interval: 100000
  eval_tasks: all
  eval_episodes: 50
  eval_temperature: 0.0
  eval_gaussian: null
  video_episodes: 0
  save_interval: 100000
  save_best_checkpoint: true
  save_last_checkpoint: true
  primary_endpoint: final@1M
  secondary_endpoints: [best_success, best_step, last3_mean, normalized_eval_auc]
  auc: {checkpoints: [100000, 200000, 300000, 400000, 500000, 600000, 700000, 800000, 900000, 1000000], interval: [100000, 1000000], rule: trapezoidal_area_divided_by_900000}
agent_overrides:
  actor_loss: ddpgbc
  alpha: 1.0
  actor_hidden_dims: [512, 512, 512]
  value_hidden_dims: [512, 512, 512]
  layer_norm: true
  lr: 0.0003
  batch_size: 1024
  discount: 0.99
  expectile: 0.9
  tau: 0.005
  const_std: true
  discrete: false
  encoder: null
  dataset_class: GCDataset
  value_p_curgoal: 0.2
  value_p_trajgoal: 0.5
  value_p_randomgoal: 0.3
  value_geom_sample: true
  actor_p_curgoal: 0.0
  actor_p_trajgoal: 1.0
  actor_p_randomgoal: 0.0
  actor_geom_sample: false
  gc_negative: true
  p_aug: 0.0
  frame_stack: null
  compute:
    actor:
      enabled: true
      primitive: mlp
      structure: cube_tokens
      structure_kwargs: {num_cubes: 1, robot_dim: 19, cube_feature_dim: 9, token_dim: 128, robot_hidden_dim: 128, slot_identity_embedding: false}
      block: mlp_mixer
      block_kwargs: {num_blocks: 2, token_hidden_dim: 64, channel_hidden_dim: 256, tm_mode: none}
      topology: feedforward
      parameter_sharing: shared
      credit: direct
      relation_mode: legacy_none
      relation_kwargs: {}
      relation_augmenter: none
      relation_augmenter_kwargs: {}
      readout: mean_context
      readout_kwargs: {output_dim: 512}
    value:
      enabled: true
      primitive: mlp
      structure: cube_tokens
      structure_kwargs: {num_cubes: 1, robot_dim: 19, cube_feature_dim: 9, token_dim: 128, robot_hidden_dim: 128, slot_identity_embedding: false}
      block: mlp_mixer
      block_kwargs: {num_blocks: 2, token_hidden_dim: 64, channel_hidden_dim: 256, tm_mode: none}
      topology: feedforward
      parameter_sharing: shared
      credit: direct
      relation_mode: legacy_none
      relation_kwargs: {}
      relation_augmenter: none
      relation_augmenter_kwargs: {}
      readout: mean_context
      readout_kwargs: {output_dim: 512}
    critic:
      enabled: true
      primitive: mlp
      structure: cube_tokens
      structure_kwargs: {num_cubes: 1, robot_dim: 19, cube_feature_dim: 9, token_dim: 128, robot_hidden_dim: 128, slot_identity_embedding: false}
      block: mlp_mixer
      block_kwargs: {num_blocks: 2, token_hidden_dim: 64, channel_hidden_dim: 256, tm_mode: none}
      topology: feedforward
      parameter_sharing: shared
      credit: direct
      relation_mode: legacy_none
      relation_kwargs: {}
      relation_augmenter: none
      relation_augmenter_kwargs: {}
      readout: mean_context
      readout_kwargs: {output_dim: 512}
