  actor_geom_sample: false
  gc_negative: true
  p_aug: 0.0
  frame_stack: null
  compute:
    actor: {enabled: false, primitive: mlp, structure: vector, block: plain, topology: feedforward, credit: direct}
    value: {enabled: false, primitive: mlp, structure: vector, block: plain, topology: feedforward, credit: direct}
    critic: {enabled: false, primitive: mlp, structure: vector, block: plain, topology: feedforward, credit: direct}
