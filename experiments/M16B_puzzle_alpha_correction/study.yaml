study_id: M16B
name: "GCIQL Puzzle alpha correction: Flat versus Mixer L2"
question: >-
  Under the official Puzzle-play GCIQL alpha=1.0 setting, does the joint
  Puzzle-token MLP-Mixer L2 configuration outperform the canonical Flat GCIQL
  baseline on Puzzle 3x3, 4x4, 4x5, and 4x6 play tasks?
parent_study: M16A
correction_scope: >-
  This is a clean alpha correction and partial replication of M16A. M16A used
  alpha=0.3 for all conditions; M16B uses alpha=1.0 and includes B000/S002
  only. S001 and S004 are intentionally deferred.
primary_factors:
  - actor_bc_weight
  - representation_structure
fixed_design:
  algorithm: gciql
  actor_hidden_dims: [512, 512, 512]
  value_hidden_dims: [512, 512, 512]
  layer_norm: true
  lr: 0.0003
  batch_size: 1024
  train_steps: 1000000
  discount: 0.99
  expectile: 0.9
  tau: 0.005
  actor_loss: ddpgbc
  alpha: 1.0
  const_std: true
  discrete: false
  dataset_class: GCDataset
  value_goal_sampling: {p_curgoal: 0.2, p_trajgoal: 0.5, p_randomgoal: 0.3, geom_sample: true}
  actor_goal_sampling: {p_curgoal: 0.0, p_trajgoal: 1.0, p_randomgoal: 0.0, geom_sample: false}
  gc_negative: true
  p_aug: 0.0
  frame_stack: null
  structured:
    structure: puzzle_tokens
    topology: feedforward
    block: mlp_mixer
    primitive: mlp
    credit: direct
    token_dim: 128
    robot_hidden_dim: 128
    token_mlp_hidden_dim: 64
    channel_mlp_hidden_dim: 256
    index_embedding: true
    readout: mean
    tm_mode: none
  polyak_semantics: target_new = tau * online_post_gradient + (1 - tau) * target_old
alpha_policy:
  mode: explicit_per_study
  value: 1.0
  allowed_values: [0.3, 1.0]
  runtime_authority: configuration.agent_overrides.alpha
  source: OGBench official Puzzle-play GCIQL benchmark setting
conditions: [B000, S002]
deferred_conditions: [S001, S004]
deferred_factors:
  - S001_and_S004
  - matching_parameter_or_MAC_budget
  - additional_training_seeds
  - other_algorithms
algorithms: [gciql]
placements: [actor+value+critic]
environments:
  - puzzle-3x3-play-v0
  - puzzle-4x4-play-v0
  - puzzle-4x5-play-v0
  - puzzle-4x6-play-v0
seeds: [0]
primary_metric: evaluation/overall_success
protocol:
  train_steps: 1000000
  batch_size: 1024
  log_interval: 5000
  eval_interval: 100000
  eval_tasks: all
  eval_task_count: 5
  eval_episodes: 20
  eval_temperature: 0.0
  eval_gaussian: null
  video_episodes: 0
  save_interval: 100000
  save_best_checkpoint: true
  save_last_checkpoint: true
  selection_metric: evaluation/overall_success
  selection_rule: strict_greater_than_keep_earlier_tie
  primary_endpoint: final@1M
  secondary_endpoints: [best_success, best_step, normalized_eval_auc, last3_mean]
  auc:
    checkpoints: [100000, 200000, 300000, 400000, 500000, 600000, 700000, 800000, 900000, 1000000]
    interval: [100000, 1000000]
    rule: trapezoidal_area_divided_by_900000
  formal_training_started: false
environment_references:
  puzzle-3x3-play-v0: {underlying_ogbench_env: puzzle-3x3-v0, num_buttons: 9, role: lowest_complexity_reference}
  puzzle-4x4-play-v0: {underlying_ogbench_env: puzzle-4x4-v0, num_buttons: 16, role: intermediate_complexity}
  puzzle-4x5-play-v0: {underlying_ogbench_env: puzzle-4x5-v0, num_buttons: 20, role: high_complexity}
  puzzle-4x6-play-v0: {underlying_ogbench_env: puzzle-4x6-v0, num_buttons: 24, role: highest_complexity}
comparison_policy:
  within_alpha: B000 versus S002 is the controlled representation comparison.
  across_alpha: M16B versus M16A is an alpha sensitivity/correction comparison, not a pure architecture comparison.
  baseline_reference: M16A B000 at alpha=0.3, matched by environment and seed where provenance permits.
acceptance:
  expected_formal_runs: 8
  expected_environment_condition_cells: 8
  require_all_cells_completed: true
  no_early_stopping_for_poor_performance: true
  no_git_writes_by_agent: true
  no_automatic_formal_launch: true
