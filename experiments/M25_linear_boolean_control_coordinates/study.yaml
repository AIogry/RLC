study_id: M25
name: "M25 — Linear Reversible Boolean Control Coordinates"
question: >-
  Can an information-preserving linear Boolean change of coordinates learned
  only from real adjacent offline Puzzle board-change edges make every
  observed short intervention an axis-local edit?
research_program: "M25 — Learned Control Coordinates"
parent_studies: [M23A, M24A]
primary_factors:
  - environment
  - candidate_flow_depth
fixed_design:
  protocol_stage: engineering_stage1
  scientific_status: implementation_and_capacity_preflight_only
  transform: linear_reversible_boolean_flow
  output_variables_equal_input_bits: true
  trainable_translation: false
  coupling: fixed_permutation_conjugated_gf2_additive
  binary_forward: hard_exact
  gradient_estimator: sigmoid_straight_through
  event_definition: adjacent_same_episode_nonzero_board_change
  model_inputs: [start_board, end_board]
  event_sampling_mode: uniform
  cross_context_pairing_loss: false
  reconstruction_loss: false
  privileged_training_information: none
  depth_status: engineering_candidate_not_scientifically_fixed
deferred_factors:
