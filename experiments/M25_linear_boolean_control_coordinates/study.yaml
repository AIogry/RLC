  - additional_training_seeds
  - nonlinear_boolean_flows
  - effect_balanced_sampling
  - physical_operation_grounding
  - goal_conditioned_rl_integration
  - singular_4x4_quotient_coordinates
algorithms: [control_coordinate]
placements: [standalone_stage1_representation]
