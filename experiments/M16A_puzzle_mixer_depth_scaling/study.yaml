study_id: M16A
name: GCIQL Puzzle Mixer Depth Scaling
question: >-
  Does structured Puzzle tokenization with a fixed MLP-Mixer improve GCIQL
  performance as Puzzle complexity increases, and how does Mixer depth affect
  the effect across 3x3, 4x4, 4x5, and 4x6 Play tasks?
primary_factors:
  - environment_complexity
  - representation_structure
  - mixer_depth
fixed_design:
  algorithm: gciql
  actor_hidden_dims: [512, 512, 512]
  value_hidden_dims: [512, 512, 512]
  layer_norm: true
  lr: 0.0003
  batch_size: 1024
  train_steps: 1000000
  discount: 0.99
  expectile: 0.9
  tau: 0.005
  actor_loss: ddpgbc
  alpha: 0.3
  const_std: true
  discrete: false
  dataset_class: GCDataset
  value_goal_sampling: {p_curgoal: 0.2, p_trajgoal: 0.5, p_randomgoal: 0.3, geom_sample: true}
  actor_goal_sampling: {p_curgoal: 0.0, p_trajgoal: 1.0, p_randomgoal: 0.0, geom_sample: false}
  gc_negative: true
  p_aug: 0.0
  frame_stack: null
  structured:
    structure: puzzle_tokens
    topology: feedforward
    block: mlp_mixer
    primitive: mlp
    credit: direct
    token_dim: 128
    robot_hidden_dim: 128
    token_mlp_hidden_dim: 64
    channel_mlp_hidden_dim: 256
    index_embedding: true
    readout: mean
    tm_mode: none
  polyak_semantics: target_new = tau * online_post_gradient + (1 - tau) * target_old
deferred_factors:
  - matching_parameter_or_MAC_budget
  - recurrent_or_two_state_token_computation
  - HRM_or_adaptive_depth
  - alternative_tokenizers
  - alternative_readouts
  - additional_GCIQL_hyperparameters
  - additional_training_seeds
  - other_algorithms
algorithms: [gciql]
placements: [actor+value+critic]
environments:
  - puzzle-3x3-play-v0
  - puzzle-4x4-play-v0
  - puzzle-4x5-play-v0
  - puzzle-4x6-play-v0
seeds: [0]
primary_metric: evaluation/overall_success
protocol:
  train_steps: 1000000
  batch_size: 1024
  log_interval: 5000
  eval_interval: 100000
  eval_tasks: all
  eval_task_count: 5
  eval_episodes: 20
  eval_temperature: 0.0
  eval_gaussian: null
  video_episodes: 0
  save_interval: 100000
  save_best_checkpoint: true
  save_last_checkpoint: true
  selection_metric: evaluation/overall_success
  selection_rule: strict_greater_than_keep_earlier_tie
  primary_endpoint: final@1M
  secondary_endpoints: [best_success, best_step, normalized_eval_auc, last3_mean]
  auc:
    checkpoints: [100000, 200000, 300000, 400000, 500000, 600000, 700000, 800000, 900000, 1000000]
    interval: [100000, 1000000]
    rule: trapezoidal_area_divided_by_900000
  formal_training_started: false
environment_references:
  puzzle-3x3-play-v0: {underlying_ogbench_env: puzzle-3x3-v0, num_buttons: 9, role: lowest_complexity_reference}
  puzzle-4x4-play-v0: {underlying_ogbench_env: puzzle-4x4-v0, num_buttons: 16, role: intermediate_complexity}
  puzzle-4x5-play-v0: {underlying_ogbench_env: puzzle-4x5-v0, num_buttons: 20, role: high_complexity}
  puzzle-4x6-play-v0: {underlying_ogbench_env: puzzle-4x6-v0, num_buttons: 24, role: highest_complexity}
hypotheses:
  H1: Structured tokenization may have a positive or neutral effect on Puzzle performance, especially as button count grows.
  H2: Mixer depth may show a non-monotonic bias-capacity tradeoff; monotonic improvement is not preregistered.
  H3: Any structured advantage should be interpreted jointly with complexity and architecture accounting, not from pooled means alone.
cross_environment_boundary: >-
  Comparisons across Puzzle sizes are descriptive complexity-associated changes;
  within-environment contrasts between B000 and S001/S002/S004 are the controlled
  representation-depth comparisons.
acceptance:
  expected_formal_runs: 16
  expected_environment_condition_cells: 16
  require_all_cells_completed: true
  no_early_stopping_for_poor_performance: true
  no_git_writes_by_agent: true
  no_automatic_formal_launch: true
