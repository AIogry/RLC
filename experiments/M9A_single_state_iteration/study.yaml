study_id: M9A
name: Single-state iterative actor computation for GCRL
question: Does decision-local single-state iterative actor computation improve GCRL actor learning, and how do depth, residual update, and actor placement affect it?
primary_factors:
  - algorithm
  - placement
  - internal_iterations_K
  - residual
  - topology
fixed_design:
  state_scope: decision_local
  state_learned: false
  input_injection: z+x
  update_module: mlp
  parameter_sharing: shared
  crosses_environment_step: false
  state_init: normal_buffer
  state_init_std: 1.0
deferred_factors:
  - state_initialization_alternatives
  - input_injection_alternatives
  - gating
  - normalization_recipe
  - multi_state
  - hrm
algorithms:
  - hiql
  - crl
placements:
  - actor
  - high_actor
  - low_actor
  - high_actor+low_actor
environments:
  - antmaze-medium-navigate-v0
  - antmaze-large-navigate-v0
seeds:
  - 0
primary_metric: evaluation/overall_success
