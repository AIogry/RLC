study_id: "M26"
name: "M26 — Puzzle Goal Coordinate Mechanism Diagnostics"
question: "At fixed v2 9D input width, GCIQL and Mixer-L2, how do exact distance, operation-coordinate recoding and actor/value-side placement affect final task success on Puzzle-4x5?"
research_program: "M24 — Operation-Aligned Goal Learning"
parent_studies: ["M24A"]
primary_factors: ["actor_coordinate","value_side_coordinate","transform_id","distance_feature"]
fixed_design:
  algorithm: "gciql"
  actor_hidden_dims: [512,512,512]
  value_hidden_dims: [512,512,512]
  layer_norm: true
  lr: 0.0003
  batch_size: 1024
  train_steps: 1000000
  discount: 0.99
  expectile: 0.9
  tau: 0.005
  actor_loss: "ddpgbc"
  alpha: 0.4
  const_std: true
  discrete: false
  encoder: null
  dataset_class: "PuzzleBoardGCDataset"
  goal_success_semantics: "board_equality"
  value_goal_sampling:
    p_curgoal: 0.2
    p_trajgoal: 0.5
    p_randomgoal: 0.3
    geom_sample: true
  actor_goal_sampling:
    p_curgoal: 0
    p_trajgoal: 1
    p_randomgoal: 0
    geom_sample: false
  gc_negative: true
  p_aug: 0
  frame_stack: null
  current_observation_policy: "preserve_all_robot_button_and_transient_fields"
  goal_robot_policy: "zero"
  goal_button_transient_policy: "zero"
  structured:
    placement: "actor+value+critic"
    structure: "puzzle_tokens"
    topology: "feedforward"
    block: "mlp_mixer"
    primitive: "mlp"
    credit: "direct"
    token_dim: 128
    robot_hidden_dim: 128
    token_mlp_hidden_dim: 64
    channel_mlp_hidden_dim: 256
    num_mixer_blocks: 2
    index_embedding: true
    readout: "mean"
    tm_mode: "none"
  polyak_semantics: "target_new = tau * online_post_gradient + (1 - tau) * target_old"
  goal_input_schema: "token_aux_v1"
  paired_token_dim: 9
  token_aux_dim: 1
