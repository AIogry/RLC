study_id: M22
name: M22 — OGBench Puzzle Baselines in Unified RLC
question: >-
  What are the official OGBench Puzzle baseline results for six canonical
  goal-conditioned algorithms under the unified RLC runtime?
primary_factors:
  - algorithm
  - environment
fixed_design:
  campaign: OGBench Puzzle Baselines in Unified RLC
  baseline_provenance: official_ogbench_hyperparameters
  semantic_audit: docs/9-9/canonical_semantics_audit.json
  upstream_baseline_audit: docs/9-9/M22_upstream_baseline_audit.json
  dataset_audit: docs/9-9/M22_dataset_audit.json
  canonical_compute: disabled
  formal_training_started: false
deferred_factors:
  - seed
algorithms:
  - gcbc
  - gcivl
  - gciql
  - qrl
  - crl
  - hiql
placements:
  - runtime_gpu_scheduler
environments:
  - puzzle-3x3-play-v0
  - puzzle-4x4-play-v0
  - puzzle-4x5-play-v0
  - puzzle-4x6-play-v0
seeds:
  - 0
  - 1
  - 2
