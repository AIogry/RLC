  save_last_checkpoint: true
  primary_endpoint: final@1M
  primary_metric: evaluation/overall_success
  secondary_metrics:
    - best_success
    - best_step
    - last3_mean
    - normalized_auc
    - per_task_final
  formal_training_started: false
  run_root: /data/qijunrong/06-RL/offline-rl/exp/RLC/runs/M22
  smoke_root: /tmp/m22_puzzle_baseline_smoke
  physical_gpu_policy: launcher_only
  jobs_per_gpu: 2
